name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Requires the AZURE_STATIC_WEB_APPS_API_TOKEN secret.
      # To obtain it:
      #   1. Deploy the ARM template in infra/azuredeploy.json (or create the
      #      Static Web App manually in the Azure portal).
      #   2. Open the Static Web App resource → Manage deployment token.
      #   3. Copy the token and add it as a repository secret named
      #      AZURE_STATIC_WEB_APPS_API_TOKEN (Settings → Secrets → Actions).
      - name: Deploy to Azure Static Web Apps
        uses: azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # The monorepo is pre-built above; skip_app_build tells the action to
          # use the already-built output instead of running a second build.
          app_location: apps/web/dist
          api_location: apps/api
          skip_app_build: true
          # Let the action run the API build so Oryx provides the Functions
          # language metadata required by Azure Static Web Apps.
          api_build_command: npm run build
